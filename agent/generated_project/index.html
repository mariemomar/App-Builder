<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibrantTodo</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div id="app" role="main">
        <header>
            <h1>VibrantTodo</h1>
            <button id="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
        </header>
        <section aria-label="Add new todo">
            <input id="new-todo-input" type="text" placeholder="What needs to be done?" autocomplete="off" aria-label="New todo" />
            <!-- Hidden button for accessibility (triggered via keyboard shortcut) -->
            <button id="add-todo-button" style="position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;" aria-hidden="true">Add Todo</button>
        </section>
        <ul id="todo-list" class="todo-list" aria-live="polite" aria-label="Todo list"></ul>
        <div class="filters" role="group" aria-label="Todo filters">
            <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <footer>
            <p>Made with ❤️ by VibrantTodo</p>
        </footer>
    </div>
</body>
</html>
